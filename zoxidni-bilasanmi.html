<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoxidni qanchalik bilasan?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8E9;
    --coral:#FF6B5B;
    --coral-soft:#FFD9D3;
    --teal:#2EC4B6;
    --teal-soft:#CFF3EF;
    --plum:#4B2E5B;
    --yellow:#FFD23F;
    --shadow: 0 18px 40px rgba(75,46,91,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100svh;
    background:var(--cream);
    font-family:'Nunito',sans-serif;
    color:var(--plum);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',sans-serif;
    color:var(--plum);
    font-weight:700;
  }

  /* background blobs */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:.5;
    z-index:0;
  }
  .blob-1{width:260px;height:260px;background:var(--teal-soft);top:-80px;left:-80px;}
  .blob-2{width:220px;height:220px;background:var(--coral-soft);bottom:-70px;right:-60px;}
  .blob-3{width:140px;height:140px;background:var(--yellow);opacity:.25;top:40%;right:-40px;}

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    background:#fff;
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:40px 36px;
  }

  /* progress dots */
  .progress{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:28px;
  }
  .dot{
    width:10px;height:10px;
    border-radius:50%;
    background:var(--coral-soft);
    transition:background .3s ease, transform .3s ease;
  }
  .dot.active{background:var(--coral); transform:scale(1.3);}
  .dot.done{background:var(--teal);}

  .eyebrow{
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:.72rem;
    font-weight:800;
    color:var(--teal);
    margin-bottom:6px;
  }
  .intro-title{
    text-align:center;
    font-size:clamp(1.8rem,6vw,2.4rem);
    margin-bottom:14px;
    line-height:1.2;
  }
  .intro-sub{
    text-align:center;
    color:var(--plum);
    opacity:.7;
    line-height:1.6;
    margin-bottom:30px;
  }
  .start-btn, .quiz-btn, .restart-btn{
    display:block;
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .start-btn:hover, .restart-btn:hover{background:var(--plum); transform:translateY(-2px);}

  .question-num{
    font-size:.78rem;
    font-weight:800;
    color:var(--coral);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-bottom:8px;
    text-align:center;
  }
  .question-text{
    font-family:'Baloo 2',sans-serif;
    font-size:1.35rem;
    text-align:center;
    margin-bottom:26px;
    line-height:1.35;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .opt-btn{
    text-align:left;
    padding:15px 18px;
    border-radius:14px;
    border:2px solid var(--teal-soft);
    background:#fff;
    color:var(--plum);
    font-family:'Nunito',sans-serif;
    font-size:.98rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .opt-btn:hover:not(:disabled){
    border-color:var(--coral);
    transform:translateX(4px);
  }
  .opt-btn:focus-visible{outline:3px solid var(--yellow); outline-offset:2px;}
  .opt-btn.correct{
    background:var(--teal-soft);
    border-color:var(--teal);
  }
  .opt-btn.wrong{
    background:var(--coral-soft);
    border-color:var(--coral);
  }
  .opt-btn:disabled{cursor:default;}

  .feedback{
    margin-top:18px;
    text-align:center;
    font-weight:700;
    font-size:1rem;
    min-height:26px;
    opacity:0;
    transition:opacity .25s ease;
  }
  .feedback.show{opacity:1;}
  .feedback.is-correct{color:var(--teal);}
  .feedback.is-wrong{color:var(--coral);}

  /* result screen */
  .result-emoji{
    font-size:4rem;
    text-align:center;
    margin-bottom:8px;
    animation:bounceIn .6s ease;
  }
  @keyframes bounceIn{
    0%{transform:scale(0.3); opacity:0;}
    60%{transform:scale(1.15); opacity:1;}
    100%{transform:scale(1);}
  }
  .result-score{
    text-align:center;
    font-size:1rem;
    color:var(--teal);
    font-weight:800;
    margin-bottom:6px;
  }
  .result-title{
    text-align:center;
    font-size:clamp(1.5rem,5vw,2rem);
    margin-bottom:14px;
  }
  .result-text{
    text-align:center;
    line-height:1.7;
    opacity:.8;
    margin-bottom:28px;
  }

  .gauge-wrap{
    margin:20px 0 30px;
  }
  .gauge-track{
    width:100%;
    height:16px;
    background:var(--coral-soft);
    border-radius:20px;
    overflow:hidden;
  }
  .gauge-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--coral), var(--teal));
    border-radius:20px;
    transition:width 1s cubic-bezier(.2,.8,.2,1);
  }
  .gauge-label{
    display:flex;
    justify-content:space-between;
    font-size:.72rem;
    font-weight:700;
    color:var(--plum);
    opacity:.6;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .confetti-piece{
    position:fixed;
    top:-5%;
    width:9px;height:14px;
    z-index:5;
    pointer-events:none;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(400deg); opacity:.9; }
  }

  .screen{display:none;}
  .screen.active{display:block;}

  /* love question screen */
  .love-title{
    text-align:center;
    font-size:clamp(1.6rem,5vw,2.1rem);
    margin-bottom:34px;
  }
  .love-btns{
    position:relative;
    height:220px;
  }
  .love-btn{
    position:absolute;
    padding:16px 34px;
    border-radius:16px;
    border:none;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1.1rem;
    cursor:pointer;
  }
  .love-yes{
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:var(--teal);
    color:#fff;
    transition:transform .25s ease, font-size .25s ease;
    z-index:2;
  }
  .love-no{
    left:50%;
    top:20px;
    transform:translateX(-50%);
    background:var(--coral-soft);
    color:var(--plum);
    transition:left .25s ease, top .25s ease;
    z-index:1;
  }
  .love-hint{
    text-align:center;
    font-size:.82rem;
    color:var(--plum);
    opacity:.55;
    margin-top:10px;
  }
  .love-result{
    text-align:center;
    font-family:'Baloo 2',sans-serif;
    font-size:1.4rem;
    margin-top:10px;
    display:none;
  }
  .love-result.show{display:block; animation:bounceIn .5s ease;}
  .next-btn{
    display:block;
    margin:26px auto 0;
    background:none;
    border:none;
    color:var(--teal);
    font-weight:800;
    font-family:'Nunito',sans-serif;
    text-decoration:underline;
    cursor:pointer;
    font-size:.92rem;
  }

  @media (prefers-reduced-motion: reduce){
    .result-emoji{animation:none;}
    .confetti-piece{display:none;}
  }

  @media (max-width:480px){
    .card{padding:30px 22px;}
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="card">

  <!-- INTRO SCREEN -->
  <div class="screen active" id="screen-intro">
    <div class="eyebrow">Sevara uchun kichik sinov</div>
    <h1 class="intro-title">Zoxidni qanchalik bilasan? 🤔</h1>
    <p class="intro-sub">6 ta savol, 4 tadan variant. Ba'zilari kulgili, ba'zilari — chin haqiqat. Tayyor bo'lsang, boshlaymiz!</p>
    <button class="start-btn" id="start-btn">Boshlash 🚀</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen" id="screen-quiz">
    <div class="progress" id="progress"></div>
    <div class="question-num" id="question-num"></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="screen-result">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-title" id="result-title"></div>
    <div class="gauge-wrap">
      <div class="gauge-track"><div class="gauge-fill" id="gauge-fill"></div></div>
      <div class="gauge-label"><span>Notanish</span><span>Zoxidshunos</span></div>
    </div>
    <p class="result-text" id="result-text"></p>
    <button class="restart-btn" id="restart-btn">Qaytadan urinib ko'rish 🔁</button>
    <button class="next-btn" id="to-love-btn">Yana bitta savol bor... →</button>
  </div>

  <!-- LOVE QUESTION SCREEN -->
  <div class="screen" id="screen-love">
    <div class="eyebrow">Oxirgi savol</div>
    <h2 class="love-title">Siz Zoxidni sevasizmi? 🥹</h2>
    <div class="love-btns" id="love-btns">
      <button class="love-btn love-no" id="love-no">Yo'q</button>
      <button class="love-btn love-yes" id="love-yes">Ha ❤️</button>
    </div>
    <p class="love-hint">("Yo'q" tugmasi biroz uyatchan ekan 👀)</p>
    <div class="love-result" id="love-result"></div>
  </div>

</div>

<script>
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const questions = [
  {
    q: "Zoxid ertalab energiyani nimadan oladi?",
    options: ["Ikki stakan qahvadan", "Sevaraning 'salom' xabaridan", "Sovuq dushdan", "Motivatsion videolardan"],
    correct: 1
  },
  {
    q: "Zoxidning eng katta 'zaif tomoni' nima?",
    options: ["Achchiq ovqat", "Uzun navbatlar", "Sevaraning kulgisi", "Wi-Fi ulanmasligi"],
    correct: 2
  },
  {
    q: "Agar Zoxidga bitta super qobiliyat berilsa, nimani tanlaydi?",
    options: ["Ko'rinmas bo'lishni", "Uchishni", "Vaqtni to'xtatib, Sevara bilan ko'proq qolishni", "Aqlni o'qishni"],
    correct: 2
  },
  {
    q: "Zoxidning eng katta orzusi qaysi?",
    options: ["Mashhur bo'lish", "Sevara bilan baxtli oila qurish", "Ko'p pul topish", "Dunyo bo'ylab sayohat"],
    correct: 1
  },
  {
    q: "Zoxid stresdan qanday qutuladi?",
    options: ["Sport zalida", "Uxlab", "Sevara bilan gaplashib", "Musiqa tinglab"],
    correct: 2
  },
  {
    q: "Zoxidga bir kunlik 'super kuch' berilsa, u bilan nima qiladi?",
    options: ["Dunyoni qutqaradi", "Sevara bilan tog'larga sayohatga chiqadi", "Ko'p pul ishlab topadi", "Uzoq uxlaydi"],
    correct: 1
  }
];

let current = 0;
let score = 0;
let answered = false;

const screenIntro = document.getElementById('screen-intro');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');
const screenLove = document.getElementById('screen-love');
const progressEl = document.getElementById('progress');
const qNumEl = document.getElementById('question-num');
const qTextEl = document.getElementById('question-text');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');

function showScreen(el){
  [screenIntro, screenQuiz, screenResult, screenLove].forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function buildProgress(){
  progressEl.innerHTML = '';
  questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    progressEl.appendChild(d);
  });
}

function updateProgress(){
  questions.forEach((_, i) => {
    const d = document.getElementById('dot-' + i);
    d.classList.remove('active','done');
    if(i < current) d.classList.add('done');
    else if(i === current) d.classList.add('active');
  });
}

function renderQuestion(){
  answered = false;
  feedbackEl.className = 'feedback';
  feedbackEl.textContent = '';
  updateProgress();
  const item = questions[current];
  qNumEl.textContent = `Savol ${current + 1} / ${questions.length}`;
  qTextEl.textContent = item.q;
  optionsEl.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectOption(idx, btn));
    optionsEl.appendChild(btn);
  });
}

function selectOption(idx, btn){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const allBtns = optionsEl.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  if(idx === item.correct){
    btn.classList.add('correct');
    score++;
    feedbackEl.textContent = "To'g'ri! 🎉";
    feedbackEl.classList.add('show','is-correct');
  } else {
    btn.classList.add('wrong');
    allBtns[item.correct].classList.add('correct');
    feedbackEl.textContent = "Yo'q, unday emas 😅";
    feedbackEl.classList.add('show','is-wrong');
  }

  setTimeout(() => {
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      showResult();
    }
  }, 1200);
}

function confettiBurst(){
  if(prefersReduced) return;
  const colors = ['#FF6B5B', '#2EC4B6', '#FFD23F', '#4B2E5B'];
  for(let i=0;i<40;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (2 + Math.random()*1.5) + 's';
    p.style.animationDelay = (Math.random()*0.6) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

function showResult(){
  showScreen(screenResult);
  const total = questions.length;
  const pct = Math.round((score/total)*100);
  document.getElementById('result-score').textContent = `${score} / ${total} to'g'ri javob`;

  let emoji, title, text;
  if(score === total){
    emoji = '🏆';
    title = "Mukammal natija!";
    text = "Sen Zoxid bo'yicha rasman ekspertsan. Unga PhD himoya qilish uchun ruxsat berish kerak — mavzu: 'Sevara haqida hamma narsa'.";
  } else if(score >= total - 2){
    emoji = '😍';
    title = "Zo'r ketyapsan!";
    text = "Bir-ikkitasida biroz adashding, lekin baribir Zoxidning yuragi haqida hech kim sendan ko'p bilmaydi.";
  } else if(score >= total/2){
    emoji = '😅';
    title = "Yomon emas, lekin...";
    text = "O'rtacha natija! Ehtimol, yana ko'proq suhbatlashib, ko'proq vaqt o'tkazishimiz kerak — bahona topildi.";
  } else {
    emoji = '🙈';
    title = "Hmm, tanish bo'lish vaqti keldi!";
    text = "Xavotir olma — bu hazil test edi. Lekin, aslida, buni bahona qilib yana bir uzoq suhbatga chiqishga arziydi.";
  }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-text').textContent = text;

  const gaugeFill = document.getElementById('gauge-fill');
  gaugeFill.style.width = '0%';
  setTimeout(() => { gaugeFill.style.width = pct + '%'; }, 100);

  if(score >= total - 1){
    confettiBurst();
  }
}

document.getElementById('start-btn').addEventListener('click', () => {
  current = 0; score = 0;
  buildProgress();
  showScreen(screenQuiz);
  renderQuestion();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  current = 0; score = 0;
  buildProgress();
  showScreen(screenQuiz);
  renderQuestion();
});

document.getElementById('to-love-btn').addEventListener('click', () => {
  showScreen(screenLove);
  resetLoveButtons();
});

// ---- evasive "Yo'q" button ----
const loveWrap = document.getElementById('love-btns');
const noBtn = document.getElementById('love-no');
const yesBtn = document.getElementById('love-yes');
const loveResult = document.getElementById('love-result');
let dodgeCount = 0;

function resetLoveButtons(){
  dodgeCount = 0;
  noBtn.style.left = '50%';
  noBtn.style.top = '20px';
  noBtn.style.transform = 'translateX(-50%)';
  yesBtn.style.fontSize = '1.1rem';
  yesBtn.style.transform = 'translateX(-50%) scale(1)';
  loveResult.classList.remove('show');
  loveResult.textContent = '';
}

function dodge(){
  dodgeCount++;
  const wrapRect = loveWrap.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();
  const maxX = wrapRect.width - btnRect.width - 10;
  const maxY = wrapRect.height - btnRect.height - 10;
  const newX = Math.max(10, Math.random() * maxX);
  const newY = Math.max(10, Math.random() * maxY);
  noBtn.style.left = newX + 'px';
  noBtn.style.top = newY + 'px';
  noBtn.style.transform = 'none';

  // Ha tugmasi har safar biroz kattalashadi — hazil uchun
  const grow = Math.min(1 + dodgeCount * 0.08, 1.6);
  yesBtn.style.fontSize = (1.1 * grow) + 'rem';
}

noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive:false });
noBtn.addEventListener('focus', dodge);

function loveHeartBurst(){
  if(prefersReduced) return;
  for(let i=0;i<16;i++){
    const h = document.createElement('span');
    h.textContent = '♥';
    h.style.position = 'fixed';
    h.style.left = Math.random()*100 + 'vw';
    h.style.top = '100vh';
    h.style.color = ['#FF6B5B','#2EC4B6','#FFD23F'][i % 3];
    h.style.fontSize = (14 + Math.random()*16) + 'px';
    h.style.pointerEvents = 'none';
    h.style.zIndex = 6;
    h.style.transition = `transform ${2 + Math.random()*1.5}s ease-out, opacity ${2 + Math.random()*1.5}s ease-out`;
    document.body.appendChild(h);
    requestAnimationFrame(() => {
      h.style.transform = `translateY(-${100 + Math.random()*20}vh)`;
      h.style.opacity = '0';
    });
    setTimeout(() => h.remove(), 3800);
  }
}

yesBtn.addEventListener('click', () => {
  loveResult.textContent = "Bilardim! ❤️ Zoxid ham seni juda qattiq sevadi.";
  loveResult.classList.add('show');
  loveHeartBurst();
});
</script>

</body>
</html>
